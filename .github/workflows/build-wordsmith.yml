name: Build wordsmith

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, words, db]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t wordsmith-${{ matrix.service }} ./${{ matrix.service }}

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag et push
        run: |
          docker tag wordsmith-${{ matrix.service }} ${{ secrets.DOCKERHUB_USERNAME }}/wordsmith:${{ matrix.service }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wordsmith:${{ matrix.service }}