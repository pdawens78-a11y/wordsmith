services:
  web:
    image: dhpierre/wordsmith:web
    ports:
      - "8080:80"
    depends_on:
      - words

  words:
    image: dhpierre/wordsmith:words
    depends_on:
      db:
        condition: service_healthy

  db:
    image: dhpierre/wordsmith:db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15